server:
  port: 8080

spring:
  application:
    name: dnacloud-server
  datasource:
    url: jdbc:h2:file:./data/dnacloud;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

dnacloud:
  artifact-store: ${DNACLOUD_ARTIFACT_STORE:./artifacts}
  signing-key: ${DNACLOUD_SIGNING_KEY:}
  platform-fee-rate: ${DNACLOUD_PLATFORM_FEE_RATE:0.20}
  payment-address: ${DNACLOUD_PAYMENT_ADDRESS:}
  minimum-payout: ${DNACLOUD_MINIMUM_PAYOUT:100000}
  local-test-mode: ${DNACLOUD_LOCAL_TEST:false}

okx:
  x402:
    verify-url: ${OKX_X402_VERIFY_URL:https://api.okx.com/v1/x402/verify}
    settle-url: ${OKX_X402_SETTLE_URL:https://api.okx.com/v1/x402/settle}
    api-key: ${OKX_API_KEY:}
    secret-key: ${OKX_SECRET_KEY:}
    passphrase: ${OKX_PASSPHRASE:}

logging:
  level:
    com.okg.dnacloud: INFO
